name: Sprig Auto Triage
on:
    pull_request_target:
        types: [opened, synchronize, assigned, unassigned, edited, reopened, ready_for_review]
    pull_request_review:
        types: [submitted]
    issue_comment:
        types: [created]
    workflow_dispatch:
        inputs:
            pr_number:
                description: 'PR number to test'
                required: false
                type: string

permissions:
    pull-requests: write
    issues: write
    contents: read

jobs:
    validate-submission:
        runs-on: ubuntu-latest
        concurrency:
            group: auto-triage-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
            cancel-in-progress: true
        steps:
            - name: Checkout trusted automation
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref }}
                  path: automation
                  persist-credentials: false

            - name: Checkout submitted files
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  path: submission
                  persist-credentials: false
                  fetch-depth: 0

            - name: Validate submission
              run: node automation/.github/scripts/auto-triage.mjs
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_EVENT_PATH: ${{ github.event_path }}
                  SUBMISSION_PATH: ${{ github.workspace }}/submission
                  SPRIG_REVIEW_BASE_URL: https://sprig.hackclub.com/editor
                  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                  TEST_PR_NUMBER: ${{ github.event.inputs.pr_number }}
